<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Stock | MAC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <a href="/" class="brand" aria-label="MAC dashboard">
      <span class="brand-mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="38" height="38">
          <path d="M1000,14.23C455.57,14.23,14.23,455.57,14.23,1000S455.57,1985.77,1000,1985.77s985.77-441.34,985.77-985.77S1544.43,14.23,1000,14.23Zm13.44,1483H986.56L770.85,1056.54h97.52L1000,1322.44l131.63-265.9h97.52Zm118.19-553.76L1000,677.56,868.37,943.46H770.85L986.56,502.78h26.88l215.71,440.68Z"/>
        </svg>
      </span>
      <span>MAC</span>
    </a>
    <nav class="nav-actions" aria-label="Primary navigation">
      <a href="/" class="nav-link">Dashboard</a>
      <a href="/buy" class="button button-primary">Buy Stock</a>
    </nav>
  </header>

  <main class="page-shell buy-layout">
    <section class="buy-copy">
      <p class="eyebrow">New position</p>
      <h1>Buy a NASDAQ stock at the latest quoted price.</h1>
      <div class="quote-card" id="quote-card">
        <span class="metric-label">Live Quote</span>
        <strong id="quote-price">$0.00</strong>
        <p id="quote-meta">Enter a symbol to preview the current price.</p>
      </div>

      <div class="content-panel market-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Market</p>
            <h2>Popular stocks</h2>
          </div>
          <button id="refresh-stocks-btn" class="button button-secondary" type="button">Refresh</button>
        </div>
        <p id="stocks-status" class="status-message" role="status">Loading stocks...</p>
        <ul id="stock-list" class="stock-list"></ul>
      </div>
    </section>

    <section class="content-panel buy-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Order ticket</p>
          <h2>Purchase Stock</h2>
        </div>
      </div>

      <form id="purchase-form" class="stacked-form">
        <label class="field">
          <span>NASDAQ Symbol</span>
          <div class="autocomplete">
            <input id="symbol" type="text" placeholder="Search symbol or company" autocomplete="off" maxlength="12" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="symbol-suggestions" required>
            <ul id="symbol-suggestions" class="suggestions" role="listbox" hidden></ul>
          </div>
        </label>
        <p id="owned-hint" class="owned-hint" hidden></p>
        <label class="field">
          <span>Shares</span>
          <input id="units" type="number" value="1" min="0.000001" step="0.000001" required>
        </label>
        <label class="field">
          <span>Estimated Total</span>
          <input id="purchasePrice" type="text" value="$0.00" readonly>
        </label>
        <p id="form-message" class="form-error" role="alert"></p>
        <button id="purchase-btn" class="button button-primary button-full" type="submit">Buy Stock</button>
      </form>
    </section>
  </main>

  <script src="/purchase.js"></script>
</body>
</html>
